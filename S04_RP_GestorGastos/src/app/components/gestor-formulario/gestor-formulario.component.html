<section class="formulario-container">
  <h2 class="formulario-titulo">📝 Registrar Nuevo Gasto</h2>

  <div class="formulario-grid">
    <!-- Campo: Descripción -->
    <div class="campo">
      <label for="descripcion">Descripción</label>
      <input
        type="text"
        id="descripcion"
        placeholder="Ej: Almuerzo en restaurante"
        [(ngModel)]="descripcion"
      />
    </div>

    <!-- Campo: Monto -->
    <div class="campo">
      <label for="monto">Monto (S/)</label>
      <input
        type="number"
        id="monto"
        placeholder="0.00"
        [(ngModel)]="monto"
        min="0"
      />
    </div>

    <!-- Campo: Categoría -->
    <div class="campo">
      <label for="categoria">Categoría</label>
      <select id="categoria" [(ngModel)]="categoria">
        <option value="" disabled>Selecciona una categoría</option>
        @for (cat of categorias; track cat) {
          <option [value]="cat">{{ cat }}</option>
        }
      </select>
    </div>

    <!-- Campo: Fecha -->
    <div class="campo">
      <label for="fecha">Fecha</label>
      <input
        type="date"
        id="fecha"
        [(ngModel)]="fecha"
      />
    </div>
  </div>

  <!-- Botón Agregar con [disabled] -->
  <button
    class="btn-registrar"
    (click)="registrarGasto()"
    [disabled]="!formularioValido"
  >
    ➕ Registrar Gasto
  </button>
</section>
