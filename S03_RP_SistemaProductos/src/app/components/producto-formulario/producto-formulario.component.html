<section class="formulario-card">
  <h2>{{ productoAEditar ? 'Editar Producto' : 'Agregar Producto' }}</h2>

  <form #prodForm="ngForm" (ngSubmit)="prodForm.form.valid && onSubmit()" novalidate>
    <div class="form-group">
      <label for="nombre">Nombre del Producto</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        [(ngModel)]="model.nombre"
        #nombre="ngModel"
        required
        placeholder="Ej. Laptop Gamer"
        [class.is-invalid]="prodForm.submitted && nombre.invalid"
      />
      <div *ngIf="prodForm.submitted && nombre.invalid" class="error-msg">
        El nombre es obligatorio.
      </div>
    </div>

    <div class="form-group">
      <label for="categoria">Categoría</label>
      <select
        id="categoria"
        name="categoria"
        [(ngModel)]="model.categoria"
        #categoria="ngModel"
        required
        [class.is-invalid]="prodForm.submitted && categoria.invalid"
      >
        <option value="" disabled selected>Selecciona una categoría</option>
        <option *ngFor="let cat of categorias" [value]="cat">{{ cat }}</option>
      </select>
      <div *ngIf="prodForm.submitted && categoria.invalid" class="error-msg">
        Debes seleccionar una categoría.
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="precio">Precio (S/)</label>
        <input
          type="number"
          id="precio"
          name="precio"
          [(ngModel)]="model.precio"
          #precio="ngModel"
          required
          min="0.01"
          step="0.01"
          placeholder="0.00"
          [class.is-invalid]="prodForm.submitted && precio.invalid"
        />
        <div *ngIf="prodForm.submitted && precio.invalid" class="error-msg">
          Debe ser mayor a 0.
        </div>
      </div>

      <div class="form-group">
        <label for="stock">Stock</label>
        <input
          type="number"
          id="stock"
          name="stock"
          [(ngModel)]="model.stock"
          #stock="ngModel"
          required
          min="0"
          placeholder="0"
          [class.is-invalid]="prodForm.submitted && stock.invalid"
        />
        <div *ngIf="prodForm.submitted && stock.invalid" class="error-msg">
          Debe ser 0 o más.
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="descripcion">Descripción (Opcional)</label>
      <textarea
        id="descripcion"
        name="descripcion"
        [(ngModel)]="model.descripcion"
        rows="3"
        placeholder="Breve descripción del producto..."
      ></textarea>
    </div>

    <div class="form-acciones">
      <button type="submit" class="btn btn-guardar">
        {{ productoAEditar ? 'Actualizar' : 'Guardar' }}
      </button>
      <button
        *ngIf="productoAEditar"
        type="button"
        class="btn btn-cancelar"
        (click)="onCancelar()"
      >
        Cancelar
      </button>
    </div>
  </form>
</section>
